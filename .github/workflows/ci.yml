name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - "feature/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  build-test-audit:
    name: Build, Test and Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/devsecops-sentinel-web/package-lock.json

      - name: Verify repository protection
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Verify Central Package Management
        shell: pwsh
        run: ./scripts/verify-central-packages.ps1

      - name: Restore .NET packages
        run: dotnet restore ./DevSecOpsSentinel.slnx

      - name: Build .NET solution
        run: >
          dotnet build ./DevSecOpsSentinel.slnx
          --configuration Release
          --no-restore

      - name: Run .NET tests
        run: >
          dotnet test ./DevSecOpsSentinel.slnx
          --configuration Release
          --no-build
          --verbosity normal

      - name: Audit NuGet packages
        run: >
          dotnet list ./DevSecOpsSentinel.slnx
          package
          --vulnerable
          --include-transitive

      - name: Install frontend dependencies
        working-directory: src/devsecops-sentinel-web
        run: npm ci

      - name: Verify frontend toolchain
        working-directory: src/devsecops-sentinel-web
        run: npm run verify:toolchain

      - name: Run frontend tests
        working-directory: src/devsecops-sentinel-web
        run: npm test

      - name: Audit frontend packages
        working-directory: src/devsecops-sentinel-web
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: src/devsecops-sentinel-web
        run: npm run build

      - name: Verify release package
        shell: pwsh
        run: ./scripts/verify-release-package.ps1
