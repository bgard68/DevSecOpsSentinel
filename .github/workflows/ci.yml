name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

#
# Branch work is validated through its pull request. Running the same commit
# again on push would double the Actions minutes consumed by every branch,
# which matters on the Free plan allowance for private repositories.
#
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  classify-changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.changes.outputs.api }}
      frontend: ${{ steps.changes.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine which parts of the repository changed
        id: changes
        shell: bash
        #
        # Workflow expressions are passed through the environment rather than
        # interpolated into the script body. The values here are GitHub-supplied
        # commit SHAs, but direct `${{ }}` expansion inside `run:` is the shell
        # injection pattern this project's own GHA rules exist to discourage.
        #
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          emit() {
            echo "api=$1" >> "$GITHUB_OUTPUT"
            echo "frontend=$2" >> "$GITHUB_OUTPUT"
            echo "api=$1 frontend=$2"
          }

          # A release tag builds everything, whatever the diff says. A release is
          # a claim about the whole repository, not about what last changed.
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            emit true true
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"

            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "${head}^" 2>/dev/null || true)"
            fi
          fi

          # A force-push can leave the recorded base commit unreachable once it
          # has been garbage collected. Fall back to building rather than
          # failing the job on an unresolvable diff.
          if [[ -n "$base" ]] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=""
          fi

          if [[ -z "$base" ]]; then
            emit true true
            exit 0
          fi

          api=false
          frontend=false

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue

            case "$path" in
              # Documentation changes nothing that either side builds.
              *.md|docs/*|LICENSE|.gitignore|.gitattributes)
                ;;

              # The client and everything it owns.
              src/devsecops-sentinel-web/*)
                frontend=true
                ;;

              # Server projects, tests, and the build files that govern them.
              src/DevSecOpsSentinel.*|tests/*|*.sln|*.slnx|Directory.*.props|global.json)
                api=true
                ;;

              # Workflow, tooling and repository-level configuration can affect
              # either side, so neither is assumed safe to skip.
              *)
                api=true
                frontend=true
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")

          emit "$api" "$frontend"

  repository-validation:
    name: Repository and Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify repository protection
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Verify release package
        shell: pwsh
        run: ./scripts/verify-release-package.ps1

  api:
    name: API Build, Test and Audit
    needs:
      - classify-changes
      - repository-validation
    if: needs.classify-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"

      - name: Verify Central Package Management
        shell: pwsh
        run: ./scripts/verify-central-packages.ps1

      - name: Restore .NET packages
        run: dotnet restore ./DevSecOpsSentinel.slnx

      - name: Build .NET solution
        run: >
          dotnet build ./DevSecOpsSentinel.slnx
          --configuration Release
          --no-restore

      - name: Run .NET tests
        run: >
          dotnet test ./DevSecOpsSentinel.slnx
          --configuration Release
          --no-build
          --verbosity normal

      - name: Audit NuGet packages
        run: >
          dotnet list ./DevSecOpsSentinel.slnx
          package
          --vulnerable
          --include-transitive

      # Kestrel binds https://localhost:7001, which needs a certificate to
      # exist. Trust is not required, because the smoke client skips validation.
      - name: Create the HTTPS development certificate
        run: dotnet dev-certs https

      #
      # The tests above run the application through WebApplicationFactory, with
      # the environment set to Testing and configuration supplied in memory.
      # Nothing in them exercises the real startup path: appsettings.json,
      # ValidateOnStart, the scenario files being copied to the output directory,
      # or HTTPS redirection. All 108 can pass on an application that does not
      # start.
      #
      # This step starts the application the ordinary way and drives it over
      # real HTTP. It forces Mock mode and disables GitHub, so it never spends
      # OpenAI credit or reaches the network.
      #
      - name: Run API smoke tests
        shell: pwsh
        run: ./scripts/smoke-test-api.ps1 -StartApi

  frontend:
    name: Frontend Build, Test and Audit
    needs:
      - classify-changes
      - repository-validation
    if: needs.classify-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/devsecops-sentinel-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/devsecops-sentinel-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify toolchain
        run: npm run verify:toolchain

      - name: Run tests
        run: npm test

      - name: Audit packages
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  #
  # A single job that always runs and reflects the outcome of the two that do
  # not. Branch protection cannot require a job that is sometimes skipped: a
  # skipped required check blocks the merge rather than passing it. Requiring
  # this one instead keeps selective builds compatible with a protected branch,
  # which the repository will want if it is ever made public.
  #
  gate:
    name: CI Gate
    if: always()
    needs:
      - classify-changes
      - repository-validation
      - api
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm no required job failed
        shell: bash
        env:
          RESULTS: >-
            ${{ needs.classify-changes.result }}
            ${{ needs.repository-validation.result }}
            ${{ needs.api.result }}
            ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"

          for result in $RESULTS; do
            # "skipped" is a pass: it means the change did not touch that side.
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A required job reported '$result'."
              exit 1
            fi
          done

          echo "All required jobs succeeded or were not applicable."
