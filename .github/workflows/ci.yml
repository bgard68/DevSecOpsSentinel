name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-audit:
    name: Build, Test & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/devsecops-sentinel-web/package-lock.json

      - name: Verify Central Package Management
        shell: pwsh
        run: ./scripts/verify-central-packages.ps1

      - name: Restore .NET
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run .NET Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Install Frontend Dependencies
        working-directory: src/devsecops-sentinel-web
        run: npm ci

      - name: Verify Frontend Toolchain
        working-directory: src/devsecops-sentinel-web
        run: npm run verify:toolchain

      - name: Run Frontend Tests
        working-directory: src/devsecops-sentinel-web
        run: npm test

      - name: Audit npm Packages
        working-directory: src/devsecops-sentinel-web
        run: npm audit --audit-level=high

      - name: Audit NuGet Packages
        shell: pwsh
        run: |
          dotnet list package --vulnerable --include-transitive