name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

#
# Branch work is validated through its pull request. Running the same commit
# again on push would double the Actions minutes consumed by every branch,
# which matters on the Free plan allowance for private repositories.
#
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  classify-changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build-required: ${{ steps.changes.outputs.build-required }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Determine whether build and tests are required
        id: changes
        shell: bash
        #
        # Workflow expressions are passed through the environment rather than
        # interpolated into the script body. The values here are GitHub-supplied
        # commit SHAs, but direct `${{ }}` expansion inside `run:` is the shell
        # injection pattern this project's own GHA rules exist to discourage.
        #
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A release tag always gets the full build and test suite.
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "build-required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"

            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "${head}^" 2>/dev/null || true)"
            fi
          fi

          # A force-push can leave the recorded base commit unreachable once it
          # has been garbage collected. Fall back to building rather than
          # failing the job on an unresolvable diff.
          if [[ -n "$base" ]] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=""
          fi

          if [[ -z "$base" ]]; then
            echo "build-required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          build_required=false

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue

            case "$path" in
              *.md|docs/*|LICENSE|.gitignore|.gitattributes)
                ;;
              *)
                build_required=true
                break
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")

          echo "build-required=$build_required" >> "$GITHUB_OUTPUT"

  repository-validation:
    name: Repository and Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify repository protection
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Verify release package
        shell: pwsh
        run: ./scripts/verify-release-package.ps1

  build-test-audit:
    name: Build, Test and Dependency Audit
    needs:
      - classify-changes
      - repository-validation
    if: needs.classify-changes.outputs.build-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/devsecops-sentinel-web/package-lock.json

      - name: Verify Central Package Management
        shell: pwsh
        run: ./scripts/verify-central-packages.ps1

      - name: Restore .NET packages
        run: dotnet restore ./DevSecOpsSentinel.slnx

      - name: Build .NET solution
        run: >
          dotnet build ./DevSecOpsSentinel.slnx
          --configuration Release
          --no-restore

      - name: Run .NET tests
        run: >
          dotnet test ./DevSecOpsSentinel.slnx
          --configuration Release
          --no-build
          --verbosity normal

      - name: Audit NuGet packages
        run: >
          dotnet list ./DevSecOpsSentinel.slnx
          package
          --vulnerable
          --include-transitive

      - name: Install frontend dependencies
        working-directory: src/devsecops-sentinel-web
        run: npm ci

      - name: Verify frontend toolchain
        working-directory: src/devsecops-sentinel-web
        run: npm run verify:toolchain

      - name: Run frontend tests
        working-directory: src/devsecops-sentinel-web
        run: npm test

      - name: Audit frontend packages
        working-directory: src/devsecops-sentinel-web
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: src/devsecops-sentinel-web
        run: npm run build
